name: VM E2E auto-retry (runner lost communication)

# The self-hosted runner lives on a residential/metered link that has real
# multi-minute outages. When the link drops mid-job, the runner's job-lock
# renewals fail, GitHub expires the job server-side (~10 min), and the run
# dies with "The self-hosted runner lost communication with the server" —
# killing perfectly good work during e.g. the macOS cargo build (seen
# 2026-07-11 and 2026-07-12, identical signature).
#
# This retries ONLY that infra class, at most twice, from a HOSTED runner (so
# the retry itself doesn't depend on the flaky link; the rerun just queues
# until the self-hosted runner reconnects). Real test failures stay red.
on:
  workflow_run:
    workflows: ["VM E2E (Parallels)"]
    types: [completed]

permissions:
  actions: write
  checks: read

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rerun failed jobs if (and only if) the runner lost communication
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          REPO: ${{ github.repository }}
        run: |
          lost=0
          for job_id in $(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs" \
                            --jq '.jobs[] | select(.conclusion=="failure") | .id'); do
            if gh api "repos/$REPO/check-runs/$job_id/annotations" --jq '.[].message' 2>/dev/null \
                 | grep -q "lost communication with the server"; then
              lost=1
              echo "job $job_id failed with runner-lost-communication"
            fi
          done
          if [ "$lost" = 1 ]; then
            echo "infra failure — rerunning failed jobs (attempt $ATTEMPT -> $((ATTEMPT + 1)))"
            gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
          else
            echo "not the lost-communication class — leaving the failure red"
          fi
