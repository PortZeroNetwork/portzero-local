name: VM E2E (Parallels)

# Hardware-in-the-loop coverage that CI's hosted runners can't give: real
# installers, real trust stores, real TUN/wintun adapters, driven end to end
# on genuine Windows/Linux/macOS guests. See vmtest/README.md.
#
# windows/linux binaries are built on hosted runners (build-windows,
# build-linux below) and pushed into the guests, so vm-test always exercises
# the commit under test — not whatever was last baked into a VM's "built"
# snapshot by hand. macOS builds directly on the self-hosted runner (which
# already runs macOS) and pushes its own binary in; see vmtest/scripts/vm.sh.
#
# Runs on the org's one self-hosted macOS runner, which also hosts the
# Parallels VMs under test. vm-test stops any other running VM on the host
# (one-VM-at-a-time enforcement) and reuses this one Mac's Parallels
# install, so it isn't free of side effects on a machine also used
# interactively — acceptable for this org's workflow, worth knowing if that
# changes.
on:
  pull_request:
    branches:
      - develop
      - release/current
  push:
    branches:
      - develop
      - release/current
  workflow_dispatch:
    inputs:
      staging:
        description: "Also run the real cloud-tunnel E2E against staging (creates a throwaway staging test account per platform each run)"
        type: boolean
        default: true

concurrency:
  # Only one vm-test can meaningfully run at a time (single physical Mac,
  # single set of VMs) — queue rather than cancel, so a cancellation can't
  # land mid-test and leave a guest daemon wedged.
  group: vm-e2e
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build windows binary
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p portzero-cli --bin portzero
      - uses: actions/upload-artifact@v5
        with:
          name: portzero-windows
          path: target/release/portzero.exe
          retention-days: 1

  build-linux:
    name: Build linux binary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p portzero-cli --bin portzero
      - uses: actions/upload-artifact@v5
        with:
          name: portzero-linux
          path: target/release/portzero
          retention-days: 1

  vm-test:
    name: vm-test + vm-test-staging (windows, linux, macos)
    needs: [build-windows, build-linux]
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build macOS binary
        # macOS guest testing is host-built-artifact-only (no toolchain in
        # that guest); vm.sh pushes this into the guest itself.
        run: cargo build --release -p portzero-cli --bin portzero

      - name: Download windows binary
        uses: actions/download-artifact@v5
        with:
          name: portzero-windows
          path: vmtest/.downloaded-artifacts/windows

      - name: Download linux binary
        uses: actions/download-artifact@v5
        with:
          name: portzero-linux
          path: vmtest/.downloaded-artifacts/linux

      - name: Restore exec bit on the linux binary
        # vm.sh looks for .downloaded-artifacts/<os>/portzero[.exe] (see
        # downloaded_artifact_host_path); download-artifact doesn't preserve
        # the exec bit.
        run: chmod +x vmtest/.downloaded-artifacts/linux/portzero

      - name: vm-test (local overlay, no cloud/secrets — windows, linux, macos in series)
        run: just vm-test

      - name: vm-test-staging (real cloud tunnel against staging — windows, linux, macos in series)
        # Runs by default on every trigger (inputs.staging is unset — not
        # false — for pull_request/push, so this still evaluates true); a
        # manual dispatch can pass staging=false to skip it.
        if: ${{ inputs.staging != false }}
        # Rotated seed token: read from the same host-side file the
        # interactive scripts already default to (this runner IS the host
        # that owns that file — no GitHub secret needed). See
        # STAGING_SECRETS_HOST_DEFAULT in vmtest/scripts/vm.sh.
        run: just vm-test-staging
