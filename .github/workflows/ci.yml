name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Run the unprivileged suite on both Linux and macOS. The root-gated
        # real-TUN test skips cleanly when geteuid() != 0, so it is CI-safe.
        # windows-latest is a follow-on (task-28).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Tests
        run: cargo test --workspace

  e2e:
    name: E2E (privileged real TUN)
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Ensure TUN device (Linux only)
        if: runner.os == 'Linux'
        run: |
          if [ ! -e /dev/net/tun ]; then
            sudo modprobe tun
          fi

      - name: Build test binary (populate cache as user)
        run: cargo build -p port-zero-daemon --tests

      - name: E2E — real TUN overlay (root-gated)
        run: sudo -E $(which cargo) test -p port-zero-daemon --test overlay_e2e real_tun_overlay -- --nocapture
