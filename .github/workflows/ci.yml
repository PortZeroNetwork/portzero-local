name: CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Run the unprivileged suite on every supported desktop OS.
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Ensure TUN device (Linux only)
        if: runner.os == 'Linux'
        run: |
          if [ ! -e /dev/net/tun ]; then
            sudo modprobe tun
          fi

      - name: E2E - real TUN overlay (privileged opt-in)
        if: runner.os != 'Windows'
        timeout-minutes: 5
        run: sudo -E env PORTZERO_REQUIRE_REAL_TUN_E2E=1 $(which cargo) test -p portzero-daemon --test overlay_e2e real_tun_overlay -- --nocapture

      - name: Prepare Wintun (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wintunDir = Join-Path $PWD ".wintun"
          New-Item -ItemType Directory -Force -Path $wintunDir | Out-Null
          $zip = Join-Path $wintunDir "wintun.zip"
          Invoke-WebRequest `
            -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" `
            -OutFile $zip `
            -TimeoutSec 60
          Expand-Archive -Path $zip -DestinationPath $wintunDir -Force
          Copy-Item `
            (Join-Path $wintunDir "wintun\bin\amd64\wintun.dll") `
            (Join-Path $wintunDir "wintun.dll") `
            -Force
          Add-Content $env:GITHUB_PATH $wintunDir

      - name: E2E - real TUN overlay (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        env:
          PORTZERO_REQUIRE_REAL_TUN_E2E: "1"
        run: cargo test -p portzero-daemon --test overlay_e2e real_tun_overlay -- --nocapture
