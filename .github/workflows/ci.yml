name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Run the unprivileged suite on every supported desktop OS.
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Ensure TUN device (Linux only)
        if: runner.os == 'Linux'
        run: |
          if [ ! -e /dev/net/tun ]; then
            sudo modprobe tun
          fi

      - name: E2E - real TUN overlay (root-gated)
        if: runner.os != 'Windows'
        run: sudo -E $(which cargo) test -p portzero-daemon --test overlay_e2e real_tun_overlay -- --nocapture

      - name: E2E - real TUN overlay (Windows skip path)
        if: runner.os == 'Windows'
        run: cargo test -p portzero-daemon --test overlay_e2e real_tun_overlay -- --nocapture
