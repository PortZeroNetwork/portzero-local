name: CI

on:
  # CI runs before release branch updates, not after them. Use branch
  # protection rules on `release/*` to require these checks before merge.
  pull_request:
    branches:
      - 'release/*'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runs on a persistent self-hosted runner instead of GitHub's
        # hosted macos-15 to avoid its ~10x Actions-minute multiplier. Linux
        # and Windows stay on GitHub-hosted runners (cheap, and there's no
        # local Windows box). The runner must be registered with the
        # `portzero-macbook` label and NOT run with `--ephemeral`, or the
        # caching below has nothing to persist against.
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          - os: macos-self-hosted
            runner: [self-hosted, macOS, portzero-macbook]
          - os: windows-latest
            runner: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Self-hosted macOS is a persistent box: don't let checkout's
          # default `git clean -ffdx` wipe the target dir / cargo cache
          # between runs. GitHub-hosted runners are ephemeral anyway, so
          # this has no effect there.
          clean: ${{ runner.os != 'macOS' }}

      - name: Point Cargo at a persistent cache dir (self-hosted macOS only)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$HOME/ci-cache/portzero-local/cargo-home" "$HOME/ci-cache/portzero-local/target"
          echo "CARGO_HOME=$HOME/ci-cache/portzero-local/cargo-home" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$HOME/ci-cache/portzero-local/target" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache cargo registry/target (GitHub-hosted runners only)
        # Self-hosted macOS already persists its cargo home/target dir on
        # local disk (set up above); routing it through actions/cache would
        # just add a redundant upload/download over the metered connection.
        if: runner.os != 'macOS'
        uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: OpenAPI spec is up to date (Linux only)
        if: runner.os == 'Linux'
        run: |
          cargo run -p portzero-daemon --bin generate-openapi
          git diff --exit-code api/management-v1.yaml

  e2e:
    name: E2E real TUN overlay (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Same self-hosted-macOS setup as the check job above.
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          - os: macos-self-hosted
            runner: [self-hosted, macOS, portzero-macbook]
          - os: windows-latest
            runner: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          clean: ${{ runner.os != 'macOS' }}

      - name: Point Cargo at a persistent cache dir (self-hosted macOS only)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$HOME/ci-cache/portzero-local/cargo-home" "$HOME/ci-cache/portzero-local/target"
          echo "CARGO_HOME=$HOME/ci-cache/portzero-local/cargo-home" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$HOME/ci-cache/portzero-local/target" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/target (GitHub-hosted runners only)
        if: runner.os != 'macOS'
        uses: Swatinem/rust-cache@v2

      - name: Build test binary (populate cache as user)
        run: cargo build -p portzero-daemon --tests

      - name: Ensure TUN device (Linux only)
        if: runner.os == 'Linux'
        run: |
          if [ ! -e /dev/net/tun ]; then
            sudo modprobe tun
          fi

      - name: Prepare Wintun (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wintunDir = Join-Path $PWD ".wintun"
          New-Item -ItemType Directory -Force -Path $wintunDir | Out-Null
          $zip = Join-Path $wintunDir "wintun.zip"
          Invoke-WebRequest `
            -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" `
            -OutFile $zip `
            -TimeoutSec 60
          Expand-Archive -Path $zip -DestinationPath $wintunDir -Force
          Copy-Item `
            (Join-Path $wintunDir "wintun\bin\amd64\wintun.dll") `
            (Join-Path $wintunDir "wintun.dll") `
            -Force
          Add-Content $env:GITHUB_PATH $wintunDir

      - name: E2E - real TUN overlay (privileged opt-in)
        if: runner.os != 'Windows'
        timeout-minutes: 5
        run: sudo -E env PORTZERO_REQUIRE_REAL_TUN_E2E=1 $(which cargo) test -p portzero-daemon --test overlay_e2e real_tun_overlay -- --nocapture

      - name: E2E - real TUN overlay (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        env:
          PORTZERO_REQUIRE_REAL_TUN_E2E: "1"
        run: |
          cargo test -p portzero-daemon --test overlay_e2e real_tun_overlay -- --nocapture
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            Write-Host "`n--- Windows network diagnostics ---"
            Get-NetAdapter -Name "portzero-e2e" -ErrorAction SilentlyContinue | Format-List Name,InterfaceIndex,Status,MacAddress,LinkSpeed
            Get-NetIPAddress -InterfaceAlias "portzero-e2e" -ErrorAction SilentlyContinue | Format-Table -AutoSize
            Get-NetRoute -ErrorAction SilentlyContinue | Where-Object { $_.DestinationPrefix -like "10.254.*" } | Format-Table -AutoSize
            Get-DnsClientNrptRule -ErrorAction SilentlyContinue | Where-Object { $_.Namespace -like "*portzero.local*" } | Format-List
            netsh interface ipv4 show config name="portzero-e2e"
            exit $testExitCode
          }
