name: Release

on:
  # Release is triggered only by pushes to release/* (typically the merge commit
  # after a PR is merged). No workflow_run or manual dispatch.
  push:
    branches:
      - 'release/*'

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -1)
          LATEST_TAG="${LATEST_TAG:-v0.0.0}"

          MAJOR=$(echo "$LATEST_TAG" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$LATEST_TAG" | cut -d. -f2)
          PATCH=$(echo "$LATEST_TAG" | cut -d. -f3)

          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qE "BREAKING CHANGE|\[major\]"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$COMMIT_MSG" | grep -qE "^feat(\([^)]+\))?:|\[minor\]"; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.archive_name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bins: portzero
            archive_ext: tar.gz
            archive_name: portzero-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            bins: portzero
            cross: true
            archive_ext: tar.gz
            archive_name: portzero-linux-arm64
          - target: i686-unknown-linux-gnu
            os: ubuntu-latest
            bins: portzero
            cross: true
            archive_ext: tar.gz
            archive_name: portzero-linux-x86
          - target: x86_64-apple-darwin
            os: macos-15
            bins: portzero
            archive_ext: tar.gz
            archive_name: portzero-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-15
            bins: portzero
            archive_ext: tar.gz
            archive_name: portzero-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bins: portzero
            archive_ext: zip
            archive_name: portzero-windows-amd64

    steps:
      - uses: actions/checkout@v5

      - name: Set CLI package version
        run: scripts/set-cli-version.sh "${{ needs.version.outputs.version }}"
        shell: bash

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ matrix.os != 'windows-latest' }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        env:
          PKG_CONFIG_SYSROOT_DIR: ${{ matrix.cross && '/' || '' }}
        run: |
          build_cmd="cargo"
          if [ "${{ matrix.cross }}" = "true" ]; then
            build_cmd="cross"
          fi

          IFS=',' read -ra BINS <<< "${{ matrix.bins }}"
          bin_flags=""
          for bin in "${BINS[@]}"; do
            bin_flags="$bin_flags --bin $bin"
          done

          $build_cmd build --release --target ${{ matrix.target }} $bin_flags
        shell: bash

      - name: Package (Unix)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          staging="${{ matrix.archive_name }}"
          mkdir -p "$staging"

          IFS=',' read -ra BINS <<< "${{ matrix.bins }}"
          for bin in "${BINS[@]}"; do
            cp "target/${{ matrix.target }}/release/$bin" "$staging/"
          done

          tar czf "$staging.tar.gz" "$staging"

      - name: Cache wintun
        if: matrix.archive_ext == 'zip'
        uses: actions/cache@v4
        with:
          path: wintun.zip
          key: wintun-0.14.1

      - name: Package (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $staging = "${{ matrix.archive_name }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          foreach ($bin in "${{ matrix.bins }}".Split(",")) {
            Copy-Item "target\${{ matrix.target }}\release\$bin.exe" "$staging\"
          }

          if (-not (Test-Path "wintun.zip")) {
            $maxRetries = 3
            for ($i = 1; $i -le $maxRetries; $i++) {
              try {
                Invoke-WebRequest `
                  -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" `
                  -OutFile "wintun.zip" `
                  -TimeoutSec 60
                break
              } catch {
                if ($i -eq $maxRetries) { throw }
                Write-Host "Download attempt $i failed, retrying in 15s..."
                Start-Sleep -Seconds 15
              }
            }
          }
          Expand-Archive -Path "wintun.zip" -DestinationPath "wintun" -Force
          Copy-Item "wintun\wintun\bin\amd64\wintun.dll" "$staging\"

          $vswhere = Join-Path "${env:ProgramFiles(x86)}" "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found; cannot locate VC++ redistributable DLLs"
          }

          $vsPath = & $vswhere `
            -latest `
            -products * `
            -requiresAny `
            -requires Microsoft.VisualStudio.Component.VC.Redist.14.Latest Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio installation with VC++ redistributable files not found"
          }

          $redistRoot = Join-Path $vsPath "VC\Redist\MSVC"
          if (-not (Test-Path $redistRoot)) {
            throw "VC++ redistributable root not found under $vsPath"
          }

          $redistVersionDir = Get-ChildItem `
              -Directory `
              -Path $redistRoot |
            Where-Object {
              $_.Name -match '^\d+\.' -and
              (Test-Path (Join-Path $_.FullName "x64"))
            } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $redistVersionDir) {
            throw "VC++ redistributable version directory with an x64 layout not found under $redistRoot"
          }

          Write-Host "VC++ redist root: $redistRoot"
          Write-Host "Selected VC++ redist version directory: $($redistVersionDir.FullName)"
          $x64Root = Join-Path $redistVersionDir.FullName "x64"
          if (Test-Path $x64Root) {
            Write-Host "x64 layout under ${x64Root}:"
            Get-ChildItem -Path $x64Root -Force |
              Select-Object Mode, Length, Name |
              Format-Table -AutoSize |
              Out-String -Width 200 |
              Write-Host
          } else {
            Write-Host "x64 layout not found under $x64Root"
          }

          $requiredDlls = @(
            "concrt140.dll",
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "msvcp140_atomic_wait.dll",
            "msvcp140_codecvt_ids.dll",
            "vccorlib140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "vcruntime140_threads.dll"
          )

          foreach ($dllName in $requiredDlls) {
            $dll = Get-ChildItem `
              -Path $x64Root `
              -Recurse `
              -File `
              -Filter $dllName |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if (-not $dll) {
              throw "VC++ x64 redistributable DLL not found under ${x64Root}: $dllName"
            }

            Copy-Item $dll.FullName "$staging\" -Force
          }

      - name: Azure login for Artifact Signing
        if: matrix.archive_ext == 'zip'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows EXE
        if: matrix.archive_ext == 'zip'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\${{ matrix.archive_name }}\portzero.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Windows EXE signature
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $exe = Resolve-Path ".\${{ matrix.archive_name }}\portzero.exe"
          function Get-SigntoolPath {
            $cmd = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if ($cmd) {
              return $cmd.Source
            }

            $sdkRoots = @(
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin",
              "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit"
            )

            foreach ($root in $sdkRoots) {
              if (-not (Test-Path $root)) {
                continue
              }

              $candidate = Get-ChildItem -Path $root -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
                Select-Object -First 1
              if ($candidate) {
                return $candidate.FullName
              }
            }

            throw "signtool.exe not found on PATH or in the Windows SDK install"
          }

          $signtool = Get-SigntoolPath
          & $signtool verify /pa /v $exe.Path
          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed to verify $($exe.Path)"
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $exe.Path
          if ($signature.Status -ne "Valid") {
            throw "Invalid Authenticode signature for $($exe.Path): $($signature.Status)"
          }

      - name: Create Windows ZIP
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $staging = "${{ matrix.archive_name }}"
          Compress-Archive -Path "$staging" -DestinationPath "$staging.zip"

      - name: Compute SHA256 (macOS)
        if: contains(matrix.target, 'apple-darwin')
        run: |
          shasum -a 256 "${{ matrix.archive_name }}.tar.gz" | awk '{print $1}' \
            > "${{ matrix.archive_name }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}.${{ matrix.archive_ext }}

      - name: Upload SHA256 (macOS)
        if: contains(matrix.target, 'apple-darwin')
        uses: actions/upload-artifact@v5
        with:
          name: sha256-${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}.sha256

  package-linux:
    name: Build Linux Packages
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set CLI package version
        run: scripts/set-cli-version.sh "${{ needs.version.outputs.version }}"
        shell: bash

      - name: Download amd64 Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: portzero-linux-amd64

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Extract binary into target/release
        run: |
          tar xzf portzero-linux-amd64.tar.gz
          mkdir -p target/release
          cp portzero-linux-amd64/portzero target/release/portzero
          chmod +x target/release/portzero

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: Build .deb package
        run: cargo deb -p portzero-cli --no-build

      - name: Build .rpm package
        run: cargo generate-rpm
        working-directory: client/crates/cli

      - name: Upload .deb
        uses: actions/upload-artifact@v5
        with:
          name: portzero-deb
          path: target/debian/*.deb

      - name: Upload .rpm
        uses: actions/upload-artifact@v5
        with:
          name: portzero-rpm
          path: target/generate-rpm/*.rpm

  package-windows:
    name: Build Windows MSI
    needs: [version, build]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Download amd64 Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: portzero-windows-amd64

      - name: Extract Windows payload
        shell: pwsh
        run: |
          Expand-Archive `
            -Path "portzero-windows-amd64.zip" `
            -DestinationPath "." `
            -Force

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Locate signtool
        shell: pwsh
        run: |
          $signtoolPath = $null

          $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if ($signtool) {
            $signtoolPath = Split-Path -Parent $signtool.Source
          } else {
            $kitRoot = Join-Path "${env:ProgramFiles(x86)}" "Windows Kits\10\bin"
            $signtool = Get-ChildItem $kitRoot -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($signtool) {
              $signtoolPath = $signtool.DirectoryName
            }
          }

          if (-not $signtoolPath) {
            throw "signtool.exe was not found on the runner"
          }

          Add-Content $env:GITHUB_PATH $signtoolPath

      - name: Build MSI
        shell: pwsh
        run: |
          $sourceDir = (Resolve-Path ".\portzero-windows-amd64").Path
          $wixRoot = "${env:ProgramFiles(x86)}\WiX Toolset*"
          $candle = Get-ChildItem $wixRoot -Recurse -Filter candle.exe |
            Select-Object -First 1
          $light = Get-ChildItem $wixRoot -Recurse -Filter light.exe |
            Select-Object -First 1

          if (-not $candle -or -not $light) {
            throw "WiX Toolset candle.exe/light.exe not found"
          }

          & $candle.FullName `
            "-dProductVersion=${{ needs.version.outputs.version }}" `
            "-dSourceDir=$sourceDir" `
            -out "portzero.wixobj" `
            "packaging\windows\portzero.wxs"

          & $light.FullName `
            -out "portzero-${{ needs.version.outputs.version }}-x86_64.msi" `
            "portzero.wixobj"

      - name: Azure login for Artifact Signing
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign MSI
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}
          files-folder-filter: portzero-*.msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify MSI signature
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Filter "portzero-*.msi" | Select-Object -First 1
          if (-not $msi) {
            throw "MSI artifact not found after signing"
          }

          function Get-SigntoolPath {
            $cmd = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if ($cmd) {
              return $cmd.Source
            }

            $sdkRoots = @(
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin",
              "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit"
            )

            foreach ($root in $sdkRoots) {
              if (-not (Test-Path $root)) {
                continue
              }

              $candidate = Get-ChildItem -Path $root -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
                Select-Object -First 1
              if ($candidate) {
                return $candidate.FullName
              }
            }

            throw "signtool.exe not found on PATH or in the Windows SDK install"
          }

          $signtool = Get-SigntoolPath
          & $signtool verify /pa /v $msi.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed to verify $($msi.FullName)"
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $msi.FullName
          if ($signature.Status -ne "Valid") {
            throw "Invalid Authenticode signature for $($msi.FullName): $($signature.Status)"
          }

      - name: Generate winget manifest
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Filter "portzero-*.msi" | Select-Object -First 1
          if (-not $msi) {
            throw "MSI artifact not found after WiX build"
          }

          & ".\scripts\generate-winget-manifest.ps1" `
            -Version "${{ needs.version.outputs.version }}" `
            -MsiPath $msi.FullName

      - name: Upload MSI
        uses: actions/upload-artifact@v5
        with:
          name: portzero-msi
          path: "*.msi"

      - name: Upload winget manifest
        uses: actions/upload-artifact@v5
        with:
          name: portzero-winget
          path: packaging/winget/manifests/**

  release:
    name: Create Release
    needs: [version, build, package-linux, package-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build-run-id: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: portzero-*
          merge-multiple: true

      - name: Download OS packages
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: portzero-{deb,rpm,msi,winget}
          merge-multiple: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v3

      - name: Generate OpenAPI spec
        run: just openapi

      - name: Copy OpenAPI spec into release assets
        run: cp api/management-v1.yaml artifacts/management-v1.yaml

      - name: Generate version manifest
        run: |
          echo "{\"version\":\"${{ needs.version.outputs.version }}\",\"commit\":\"${{ github.sha }}\"}" \
            > artifacts/version.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Install

            > **Local** (`*.portzero.local`) is governed by the [PolyForm Shield License 1.0.0](https://polyformproject.org/licenses/shield/1.0.0) ([LICENSE](https://github.com/PortZeroNetwork/portzero-local/blob/develop/LICENSE)).  
            > **Cloud** features are governed by the [Port Zero Terms of Service](https://portzero.net/terms).  
            > Required notice: Copyright Loum Technologies (https://loumtechnologies.com)

            **macOS (Homebrew)**
            ```sh
            brew tap PortZeroNetwork/portzero && brew install portzero
            ```

            **Linux**
            ```sh
            curl -fsSL https://github.com/PortZeroNetwork/portzero-local/releases/latest/download/linux-install.sh | sh
            ```

            Uninstall:
            ```sh
            ~/.portzero/bin/portzero-uninstall
            ```
            Or run the release asset directly:
            ```sh
            curl -fsSL https://github.com/PortZeroNetwork/portzero-local/releases/latest/download/linux-uninstall.sh | sh
            ```

            **Windows (winget)**
            
            Download the `.msi` from the assets below and run it manually.

            The installer and daemon perform local setup automatically where supported.
            After installing, open http://portzero.local in your browser.

            ---
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.msi
            artifacts/version.json
            artifacts/management-v1.yaml
            scripts/linux-install.sh
            scripts/linux-uninstall.sh
            artifacts/packaging/winget/manifests/**

  check-winget-token:
    name: Check WinGet Token
    needs: [release]
    runs-on: ubuntu-latest
    if: false  # Disabled along with update-winget (not shipping Winget yet)
    outputs:
      has-token: ${{ steps.check.outputs.has-token }}
    steps:
      - name: Check token presence
        id: check
        run: echo "has-token=${{ secrets.WINGET_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  update-winget:
    name: Update WinGet Package
    needs: [version, release, check-winget-token]
    runs-on: ubuntu-latest
    if: false  # Disabled: not shipping Winget packages yet
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Submit package to Windows Package Manager Community Repository
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: PortZeroNetwork.PortZero
          installers-regex: 'portzero-.*-x86_64\.msi$'
          version: ${{ needs.version.outputs.version }}
          release-tag: ${{ needs.version.outputs.tag }}
          release-repository: portzero-local
          token: ${{ secrets.WINGET_TOKEN }}
          fork-user: PortZeroNetwork

  check-homebrew-token:
    name: Check Homebrew Token
    needs: [release]
    runs-on: ubuntu-latest
    outputs:
      has-token: ${{ steps.check.outputs.has-token }}
    steps:
      - name: Check token presence
        id: check
        run: echo "has-token=${{ secrets.HOMEBREW_TAP_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  update-homebrew:
    name: Update Homebrew Formula
    needs: [version, release, check-homebrew-token]
    runs-on: ubuntu-latest
    if: ${{ needs.check-homebrew-token.outputs.has-token == 'true' }}
    steps:
      - name: Download macOS SHA256 files
        uses: actions/download-artifact@v5
        with:
          pattern: sha256-portzero-darwin-*
          merge-multiple: true

      - name: Checkout tap repository
        uses: actions/checkout@v5
        with:
          repository: PortZeroNetwork/homebrew-portzero
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          AARCH64_SHA256=$(cat portzero-darwin-arm64.sha256)
          X86_64_SHA256=$(cat portzero-darwin-amd64.sha256)

          sed -i "s/version \"[^\"]*\"/version \"${VERSION}\"/" tap/Formula/portzero.rb
          sed -i "s/sha256 \"[^\"]*\" # arm64/sha256 \"${AARCH64_SHA256}\" # arm64/" tap/Formula/portzero.rb
          sed -i "s/sha256 \"[^\"]*\" # x86_64/sha256 \"${X86_64_SHA256}\" # x86_64/" tap/Formula/portzero.rb

      - name: Commit and push
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/portzero.rb
          git diff --staged --quiet || git commit -m "portzero v${VERSION}"
          git push
