# vmkit repo config for portzero-local. Host inventory lives in
# ~/.config/vmkit/host.conf; this file only says what THIS repo tests.
# shellcheck shell=bash

VMKIT_PROJECT="portzero"
VMKIT_TEST_SNAP="built"

# --- flavors -------------------------------------------------------------
# local: overlay tunnel e2e, no cloud, no secrets.
VMKIT_FLAVOR_LOCAL_WINDOWS="vmtest/scripts/e2e-local-overlay.ps1"
VMKIT_FLAVOR_LOCAL_LINUX="vmtest/scripts/e2e-local-overlay.sh"
VMKIT_FLAVOR_LOCAL_MACOS="vmtest/scripts/e2e-local-overlay.sh"
VMKIT_FLAVOR_LOCAL_TIMEOUT=360

# staging: real cloud tunnel against staging (throwaway account per run).
VMKIT_FLAVOR_STAGING_WINDOWS="vmtest/scripts/e2e-staging-tunnel.ps1"
VMKIT_FLAVOR_STAGING_LINUX="vmtest/scripts/e2e-staging-tunnel.sh"
VMKIT_FLAVOR_STAGING_MACOS="vmtest/scripts/e2e-staging-tunnel.sh"
VMKIT_FLAVOR_STAGING_TIMEOUT=360

# lifecycle: real installer -> verify artifacts -> uninstall -> assert clean.
VMKIT_FLAVOR_LIFECYCLE_WINDOWS="vmtest/scripts/lifecycle-windows.ps1"
VMKIT_FLAVOR_LIFECYCLE_LINUX="vmtest/scripts/lifecycle-linux.sh"
VMKIT_FLAVOR_LIFECYCLE_MACOS="vmtest/scripts/lifecycle-macos.sh"
VMKIT_FLAVOR_LIFECYCLE_TIMEOUT=600

# upgrade: prior release -> new build, assert nothing duplicated.
VMKIT_FLAVOR_UPGRADE_WINDOWS="vmtest/scripts/upgrade-windows.ps1"
VMKIT_FLAVOR_UPGRADE_LINUX="vmtest/scripts/upgrade-linux.sh"
VMKIT_FLAVOR_UPGRADE_MACOS="vmtest/scripts/upgrade-macos.sh"
VMKIT_FLAVOR_UPGRADE_TIMEOUT=600

# --- env & artifact plumbing ------------------------------------------------
VMKIT_ENV_FORWARD="PORTZERO_EXE STAGING_SECRETS PORTZERO_MSI_OLD PORTZERO_DEB_OLD PORTZERO_EXE_OLD"

# CI stages per-commit binaries here; macOS pushes the host build instead
# (no toolchain in that guest, no working shared folder).
VMKIT_ARTIFACT_ENV="PORTZERO_EXE"
VMKIT_ARTIFACT_WINDOWS="vmtest/.downloaded-artifacts/windows/portzero.exe"
VMKIT_ARTIFACT_LINUX="vmtest/.downloaded-artifacts/linux/portzero"
VMKIT_ARTIFACT_MACOS="target/release/portzero"

# Rotated staging seed token, pushed into macOS guests when STAGING_SECRETS
# is unset (windows/linux read the same file via their own shares).
VMKIT_SECRETS_ENV="STAGING_SECRETS"
VMKIT_SECRETS_HOST_DEFAULT="/Volumes/MBP-Sidecar/loumtech/vm-toolchain-cache/common/staging-e2e.env"

# Wedged-run cleanup targets inside guests.
VMKIT_KILL_WINDOWS="portzero.exe"
VMKIT_KILL_UNIX="portzero http-echo"
